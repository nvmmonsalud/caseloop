name: Feature Request
description: Suggest an idea for CaseFlow
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Nice to have
        - Important
        - Critical
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Student Dashboard
        - Faculty Dashboard
        - AI / Prompting
        - Database / InsForge
        - Documentation
        - UI / Design
        - Other
    validations:
      required: true
